[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# A URL efetiva é lida de DATABASE_URL em app/core/config.py, não daqui.
sqlalchemy.url = sqlite:///./taskflow.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
